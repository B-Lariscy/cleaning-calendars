name: Update cleaning calendars
on:
  schedule:
    - cron: "7,37 * * * *"   # about every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build sites (fetch feeds, strip private data)
        env:
          # One line per feed secret (an unset secret is just empty and that feed is skipped)
          FEED_HAYES_AIRBNB: ${{ secrets.FEED_HAYES_AIRBNB }}
          FEED_HAYES_VRBO: ${{ secrets.FEED_HAYES_VRBO }}
          FEED_CAMP_WHOLE_AIRBNB: ${{ secrets.FEED_CAMP_WHOLE_AIRBNB }}
          FEED_CAMP_DOWN_VRBO: ${{ secrets.FEED_CAMP_DOWN_VRBO }}
          FEED_CAMP_DOWN_AIRBNB: ${{ secrets.FEED_CAMP_DOWN_AIRBNB }}
          FEED_CAMP_UP_AIRBNB: ${{ secrets.FEED_CAMP_UP_AIRBNB }}
          FEED_JACKSON428_1_AIRBNB: ${{ secrets.FEED_JACKSON428_1_AIRBNB }}
          FEED_JACKSON428_2_AIRBNB: ${{ secrets.FEED_JACKSON428_2_AIRBNB }}
          FEED_JACKSON432_AIRBNB: ${{ secrets.FEED_JACKSON432_AIRBNB }}
          FEED_MARBLE_BEACONS_AIRBNB: ${{ secrets.FEED_MARBLE_BEACONS_AIRBNB }}
          FEED_MARBLE_KEEPERS_AIRBNB: ${{ secrets.FEED_MARBLE_KEEPERS_AIRBNB }}
          FEED_MARBLE_LIMESTONES_AIRBNB: ${{ secrets.FEED_MARBLE_LIMESTONES_AIRBNB }}
          PREV_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build.mjs
      - name: Safety check (no private data in output)
        run: bash scripts/check-output.sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Keep scheduled runs alive (GitHub pauses cron after 60 idle days)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
